# Deploy static site over FTP on push to main.
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — hostname, e.g. ftp.example.com
#   FTP_USERNAME  — FTP user
#   FTP_PASSWORD  — FTP password (or app password)
name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Typical shared hosting web root; change if your host uses www/ or /
          server-dir: public_html/
